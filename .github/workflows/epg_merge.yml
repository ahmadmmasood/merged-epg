name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz

      - name: Run EPG merge
        run: |
          python merge_epg.py

      # =========================
      # BUILD DASHBOARD (SAFE VERSION)
      # =========================
      - name: Generate index.html
        run: |
          MERGED_XML_SIZE=$(du -h merged.xml | cut -f1)
          MERGED_GZ_SIZE=$(du -h merged.xml.gz | cut -f1)
          LOCAL_XML_SIZE=$(du -h local.xml | cut -f1)
          LOCAL_GZ_SIZE=$(du -h local.xml.gz | cut -f1)

          MERGED_CHANNELS=$(grep merged_channels log.txt | awk '{print $2}')
          LOCAL_CHANNELS=$(grep local_channels log.txt | awk '{print $2}')
          MERGED_PROGS=$(grep merged_programmes log.txt | awk '{print $2}')
          LOCAL_PROGS=$(grep local_programmes log.txt | awk '{print $2}')

          echo "<html>" > index.html
          echo "<head><title>EPG Dashboard</title></head>" >> index.html
          echo "<body>" >> index.html

          echo "<h2>EPG Dashboard</h2>" >> index.html

          echo "<h3>Downloads</h3>" >> index.html
          echo "<ul>" >> index.html
          echo "<li><a href='https://github.com/ahmadmmasood/merged-epg/releases/download/latest/merged.xml.gz'>Merged EPG</a></li>" >> index.html
          echo "<li><a href='https://github.com/ahmadmmasood/merged-epg/releases/download/latest/local.xml.gz'>Local EPG</a></li>" >> index.html
          echo "</ul>" >> index.html

          echo "<h3>File Sizes</h3>" >> index.html
          echo "<ul>" >> index.html
          echo "<li>Merged XML: $MERGED_XML_SIZE</li>" >> index.html
          echo "<li>Merged GZ: $MERGED_GZ_SIZE</li>" >> index.html
          echo "<li>Local XML: $LOCAL_XML_SIZE</li>" >> index.html
          echo "<li>Local GZ: $LOCAL_GZ_SIZE</li>" >> index.html
          echo "</ul>" >> index.html

          echo "<h3>Build Stats</h3>" >> index.html
          echo "<ul>" >> index.html
          echo "<li>Merged Channels: $MERGED_CHANNELS</li>" >> index.html
          echo "<li>Local Channels: $LOCAL_CHANNELS</li>" >> index.html
          echo "<li>Merged Programmes: $MERGED_PROGS</li>" >> index.html
          echo "<li>Local Programmes: $LOCAL_PROGS</li>" >> index.html
          echo "</ul>" >> index.html

          echo "</body></html>" >> index.html

      - name: Commit dashboard
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add index.html

          git commit -m "Update dashboard" || echo "No changes"
          git push || echo "Push skipped"

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            local.xml
            local.xml.gz
            merged.xml
            merged.xml.gz

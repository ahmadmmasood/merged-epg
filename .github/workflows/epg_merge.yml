name: Update EPG  # This is the workflow name you see in Actions

on:
  workflow_dispatch:  # allows manual run
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # === Step 1: Checkout repo ===
      - name: Checkout repo
        uses: actions/checkout@v3

      # === Step 2: Setup Python ===
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # === Step 3: Install dependencies ===
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz

      # === Step 4: Run merge_epg.py and capture logs ===
      - name: Run EPG merge
        run: |
          python -u merge_epg.py > log.txt 2>&1
          cat log.txt

      # === Step 5: Generate dashboard (index.html) ===
      - name: Generate dashboard
        run: |
          set -e
          set -o pipefail

          merged_xml_size=$(du -h merged.xml | cut -f1)
          merged_gz_size=$(du -h merged.xml.gz | cut -f1)
          local_xml_size=$(du -h local.xml | cut -f1)
          local_gz_size=$(du -h local.xml.gz | cut -f1)

          merged_channels=$(grep merged_channels log.txt | awk '{print $2}' || echo 0)
          local_channels=$(grep local_channels log.txt | awk '{print $2}' || echo 0)
          merged_programmes=$(grep merged_programmes log.txt | awk '{print $2}' || echo 0)
          local_programmes=$(grep local_programmes log.txt | awk '{print $2}' || echo 0)
          days_kept=$(grep days_kept log.txt | awk '{print $2}' || echo 0)

          cat > index.html <<EOF
<html>
<head><title>EPG Dashboard</title></head>
<body>
<h2>EPG Dashboard</h2>

<h3>Downloads</h3>
<ul>
  <li><a href="merged.xml">Merged EPG XML</a> (${merged_xml_size})</li>
  <li><a href="merged.xml.gz">Merged EPG XML.GZ</a> (${merged_gz_size})</li>
  <li><a href="local.xml">Local EPG XML</a> (${local_xml_size})</li>
  <li><a href="local.xml.gz">Local EPG XML.GZ</a> (${local_gz_size})</li>
</ul>

<h3>Build Stats</h3>
<ul>
  <li>Merged Channels: ${merged_channels}</li>
  <li>Local Channels: ${local_channels}</li>
  <li>Merged Programmes: ${merged_programmes}</li>
  <li>Local Programmes: ${local_programmes}</li>
  <li>Days Kept: ${days_kept}</li>
</ul>

<h3>Logs</h3>
<pre>
$(cat log.txt)
</pre>

</body>
</html>
EOF

      # === Step 6: Create/update release and upload files ===
      - name: Create or update latest release and upload files
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            local.xml
            local.xml.gz
            merged.xml
            merged.xml.gz
            index.html
            log.txt

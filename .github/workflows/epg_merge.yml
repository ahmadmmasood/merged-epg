name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz jq

      - name: Run EPG merge
        run: |
          python merge_epg.py > log.txt 2>&1
          cat log.txt

      - name: Generate dashboard
        run: |
          #!/bin/bash
          set -e
          # Read stats and file sizes from stats.json
          merged_channels=$(jq -r '.merged_channels' stats.json)
          local_channels=$(jq -r '.local_channels' stats.json)
          merged_programmes=$(jq -r '.merged_programmes' stats.json)
          local_programmes=$(jq -r '.local_programmes' stats.json)
          days_kept=$(jq -r '.days_kept' stats.json)
          merged_xml_size=$(jq -r '.merged_xml_size' stats.json)
          merged_gz_size=$(jq -r '.merged_gz_size' stats.json)
          local_xml_size=$(jq -r '.local_xml_size' stats.json)
          local_gz_size=$(jq -r '.local_gz_size' stats.json)

          # Convert bytes to human-readable
          human_size() { num=$1; 
            if [ $num -lt 1024 ]; then echo "${num}B";
            elif [ $num -lt $((1024*1024)) ]; then echo "$((num/1024))K";
            elif [ $num -lt $((1024*1024*1024)) ]; then echo "$((num/1024/1024))M";
            else echo "$((num/1024/1024/1024))G"; fi; }

          merged_xml_hr=$(human_size $merged_xml_size)
          merged_gz_hr=$(human_size $merged_gz_size)
          local_xml_hr=$(human_size $local_xml_size)
          local_gz_hr=$(human_size $local_gz_size)

          # Build dashboard HTML
          cat > index.html <<EOF
<html>
<head><title>EPG Dashboard</title></head>
<body>
<h2>EPG Dashboard</h2>
<h3>Downloads</h3>
<ul>
  <li><a href="merged.xml">Merged EPG XML</a> ($merged_xml_hr)</li>
  <li><a href="merged.xml.gz">Merged EPG XML.GZ</a> ($merged_gz_hr)</li>
  <li><a href="local.xml">Local EPG XML</a> ($local_xml_hr)</li>
  <li><a href="local.xml.gz">Local EPG XML.GZ</a> ($local_gz_hr)</li>
</ul>
<h3>Build Stats</h3>
<ul>
  <li>Merged Channels: $merged_channels</li>
  <li>Local Channels: $local_channels</li>
  <li>Merged Programmes: $merged_programmes</li>
  <li>Local Programmes: $local_programmes</li>
  <li>Days Kept: $days_kept</li>
</ul>
<h3>Logs</h3>
<pre>
$(cat log.txt)
</pre>
</body>
</html>
EOF

      - name: Create or update latest release and upload files
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            local.xml
            local.xml.gz
            merged.xml
            merged.xml.gz
            index.html
            log.txt

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz

      - name: Run EPG merge
        run: |
          python merge_epg.py > log.txt 2>&1
          cat log.txt

      - name: Generate dashboard
        run: |
          #!/bin/bash
          set -e
          # File sizes
          merged_xml_size=$(stat -c%s merged.xml 2>/dev/null || echo 0)
          merged_gz_size=$(stat -c%s merged.xml.gz 2>/dev/null || echo 0)
          local_xml_size=$(stat -c%s local.xml 2>/dev/null || echo 0)
          local_gz_size=$(stat -c%s local.xml.gz 2>/dev/null || echo 0)
          # Convert to human-readable
          human_readable() {
            if [[ $1 -lt 1024 ]]; then echo "${1}B"
            elif [[ $1 -lt 1048576 ]]; then echo "$((1*$1/1024))K"
            elif [[ $1 -lt 1073741824 ]]; then echo "$((1*$1/1048576))M"
            else echo "$((1*$1/1073741824))G"; fi
          }
          merged_xml_size_hr=$(human_readable $merged_xml_size)
          merged_gz_size_hr=$(human_readable $merged_gz_size)
          local_xml_size_hr=$(human_readable $local_xml_size)
          local_gz_size_hr=$(human_readable $local_gz_size)
          # Stats from log.txt
          merged_channels=$(grep '^merged_channels' log.txt | awk '{print $2}')
          local_channels=$(grep '^local_channels' log.txt | awk '{print $2}')
          merged_programmes=$(grep '^merged_programmes' log.txt | awk '{print $2}')
          local_programmes=$(grep '^local_programmes' log.txt | awk '{print $2}')
          days_kept=$(grep '^days_kept' log.txt | awk '{print $2}')
          merged_channels=${merged_channels:-0}
          local_channels=${local_channels:-0}
          merged_programmes=${merged_programmes:-0}
          local_programmes=${local_programmes:-0}
          days_kept=${days_kept:-0}
          # Build dashboard HTML
          printf '<html>\n<head><title>EPG Dashboard</title></head>\n<body>\n' > index.html
          printf '<h2>EPG Dashboard</h2>\n' >> index.html
          printf '<h3>Downloads</h3>\n<ul>\n' >> index.html
          printf '  <li><a href="merged.xml">Merged EPG XML</a> (%s)</li>\n' "$merged_xml_size_hr" >> index.html
          printf '  <li><a href="merged.xml.gz">Merged EPG XML.GZ</a> (%s)</li>\n' "$merged_gz_size_hr" >> index.html
          printf '  <li><a href="local.xml">Local EPG XML</a> (%s)</li>\n' "$local_xml_size_hr" >> index.html
          printf '  <li><a href="local.xml.gz">Local EPG XML.GZ</a> (%s)</li>\n' "$local_gz_size_hr" >> index.html
          printf '</ul>\n' >> index.html
          printf '<h3>Build Stats</h3>\n<ul>\n' >> index.html
          printf '  <li>Merged Channels: %s</li>\n' "$merged_channels" >> index.html
          printf '  <li>Local Channels: %s</li>\n' "$local_channels" >> index.html
          printf '  <li>Merged Programmes: %s</li>\n' "$merged_programmes" >> index.html
          printf '  <li>Local Programmes: %s</li>\n' "$local_programmes" >> index.html
          printf '  <li>Days Kept: %s</li>\n' "$days_kept" >> index.html
          printf '</ul>\n' >> index.html
          printf '<h3>Logs</h3>\n<pre>\n' >> index.html
          cat log.txt >> index.html
          printf '\n</pre>\n</body>\n</html>\n' >> index.html

      - name: Create or update latest release and upload files
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            local.xml
            local.xml.gz
            merged.xml
            merged.xml.gz
            index.html
            log.txt

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

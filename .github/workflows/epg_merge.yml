name: Merge EPG Daily

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz

      - name: Run EPG merge
        run: python merge_epg.py

      - name: Verify outputs exist
        run: |
          echo "=== FILE CHECK ==="
          ls -lah
          for file in merged.xml.gz local.xml.gz; do
            if [ ! -f "$file" ]; then
              echo "$file MISSING"
              exit 1
            else
              echo "$file size: $(du -h $file | cut -f1)"
            fi
          done

      - name: Commit XML files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main      # align with remote
          git add merged.xml.gz local.xml.gz index.html merge_epg.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update EPG"
            git push origin main --force    # overwrite remote safely

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest          # always use 'latest' tag
          name: "EPG Build ${{ github.run_number }}"
          files: |
            merged.xml.gz
            local.xml.gz
          allow_updates: true       # overwrite previous latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

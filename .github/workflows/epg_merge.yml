name: Merge EPG Daily

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz

      - name: Run EPG merge
        run: python merge_epg.py

      - name: Verify outputs exist
        run: |
          echo "=== FILE CHECK ==="
          ls -lah
          test -f merged.xml.gz || (echo "merged.xml.gz MISSING" && exit 1)
          test -f local.xml.gz || (echo "local.xml.gz MISSING" && exit 1)

      - name: Commit XML files
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main
          git add merged.xml.gz local.xml.gz index.html merge_epg.py
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "Auto-update EPG" && git push origin main --force)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "EPG Build ${{ github.run_number }}"
          files: |
            merged.xml.gz
            local.xml.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

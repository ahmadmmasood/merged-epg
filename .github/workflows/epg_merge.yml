name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml pytz

      - name: Run EPG merge
        run: |
          python merge_epg.py

      # =========================
      # BUILD DASHBOARD
      # =========================
      - name: Generate index.html
        run: |
          merged_xml_size=$(du -h merged.xml | cut -f1)
          merged_gz_size=$(du -h merged.xml.gz | cut -f1)
          local_xml_size=$(du -h local.xml | cut -f1)
          local_gz_size=$(du -h local.xml.gz | cut -f1)

          merged_channels=$(grep merged_channels log.txt | awk '{print $2}')
          local_channels=$(grep local_channels log.txt | awk '{print $2}')
          merged_programmes=$(grep merged_programmes log.txt | awk '{print $2}')
          local_programmes=$(grep local_programmes log.txt | awk '{print $2}')

          cat > index.html << EOF
<html>
<head><title>EPG Dashboard</title></head>
<body>

<h2>EPG Dashboard</h2>

<h3>Downloads</h3>
<ul>
  <li><a href="https://github.com/ahmadmmasood/merged-epg/releases/download/latest/merged.xml.gz">Merged EPG</a></li>
  <li><a href="https://github.com/ahmadmmasood/merged-epg/releases/download/latest/local.xml.gz">Local EPG</a></li>
</ul>

<h3>File Sizes</h3>
<ul>
  <li>Merged XML: $merged_xml_size</li>
  <li>Merged GZ: $merged_gz_size</li>
  <li>Local XML: $local_xml_size</li>
  <li>Local GZ: $local_gz_size</li>
</ul>

<h3>Build Stats</h3>
<ul>
  <li>Merged Channels: $merged_channels</li>
  <li>Local Channels: $local_channels</li>
  <li>Merged Programmes: $merged_programmes</li>
  <li>Local Programmes: $local_programmes</li>
</ul>

</body>
</html>
EOF

      # =========================
      # COMMIT ONLY DASHBOARD
      # =========================
      - name: Commit index.html
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add index.html

          git commit -m "Update dashboard" || echo "No changes"
          git push || echo "Push skipped"

      # =========================
      # RELEASE
      # =========================
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            local.xml
            local.xml.gz
            merged.xml
            merged.xml.gz
